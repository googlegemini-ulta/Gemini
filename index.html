<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Reconciliation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans p-6">
  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">Multi-Partner Reconciliation Dashboard</h1>
        <p class="text-xs text-slate-400 mt-1">Track debit, credit, and due balances separately for each partner company.</p>
      </div>
      <div class="flex items-center space-x-3">
        <select id="partner-filter" onchange="renderDashboard()" class="px-4 py-2 rounded-xl text-xs bg-slate-900 border border-slate-700 text-white font-medium focus:outline-none">
          <option value="All">All Partners</option>
          <option value="Partner Alpha">Partner Alpha</option>
          <option value="Partner Beta">Partner Beta</option>
        </select>
      </div>
    </div>

    <!-- Summary Metrics Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800">
        <div class="text-xs font-semibold text-slate-400 uppercase mb-2">Total Credit (Received)</div>
        <div id="total-credit" class="text-2xl font-bold font-mono text-emerald-400">$0.00</div>
      </div>
      <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800">
        <div class="text-xs font-semibold text-slate-400 uppercase mb-2">Total Debit (Paid/Sent)</div>
        <div id="total-debit" class="text-2xl font-bold font-mono text-indigo-400">$0.00</div>
      </div>
      <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800">
        <div class="text-xs font-semibold text-slate-400 uppercase mb-2">Total Due (Outstanding)</div>
        <div id="total-due" class="text-2xl font-bold font-mono text-rose-400">$0.00</div>
      </div>
    </div>

    <!-- Add Transaction Form -->
    <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800">
      <h2 class="text-lg font-bold mb-4">Add New Partner Transaction</h2>
      <form id="transaction-form" onsubmit="addTransaction(event)" class="grid grid-cols-1 md:grid-cols-5 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Partner Company</label>
          <select id="form-partner" class="w-full px-3 py-2 rounded-xl text-xs bg-slate-950 border border-slate-700 text-white">
            <option value="Partner Alpha">Partner Alpha</option>
            <option value="Partner Beta">Partner Beta</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Type</label>
          <select id="form-type" class="w-full px-3 py-2 rounded-xl text-xs bg-slate-950 border border-slate-700 text-white">
            <option value="Credit">Credit</option>
            <option value="Debit">Debit</option>
            <option value="Due">Due</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Amount ($ USD)</label>
          <input type="number" step="0.01" id="form-amount" required placeholder="0.00" class="w-full px-3 py-2 rounded-xl text-xs bg-slate-950 border border-slate-700 text-white">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Description</label>
          <input type="text" id="form-desc" required placeholder="Invoice / Purpose" class="w-full px-3 py-2 rounded-xl text-xs bg-slate-950 border border-slate-700 text-white">
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition-all">Add Record</button>
        </div>
      </form>
    </div>

    <!-- Transactions Table -->
    <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800">
      <h2 class="text-lg font-bold mb-4">Reconciliation Logs</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b text-xs uppercase tracking-wider border-slate-800 text-slate-400">
              <th class="py-3 px-4">ID</th>
              <th class="py-3 px-4">Partner</th>
              <th class="py-3 px-4">Type</th>
              <th class="py-3 px-4">Amount</th>
              <th class="py-3 px-4">Description</th>
              <th class="py-3 px-4">Date</th>
            </tr>
          </thead>
          <tbody id="transaction-table-body" class="divide-y divide-slate-800 text-sm font-mono">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>

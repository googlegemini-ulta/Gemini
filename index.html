<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sovereign Enterprise Ledger - Minister & Butterfly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-slate-800 pb-6 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Sovereign Enterprise Ledger</h1>
        <p class="text-sm text-slate-400 mt-1">Local Storage & GitHub Synchronized Financial Engine</p>
      </div>
      <div class="flex items-center gap-3">
        <select id="partner-filter" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          <option value="All">All Partners</option>
          <option value="Minister hi tech park (DEAL002905)">Minister hi tech park (DEAL002905)</option>
          <option value="BUTTERFLY MARKETING LIMITED (3000002272)">BUTTERFLY MARKETING LIMITED (3000002272)</option>
        </select>
      </div>
    </header>

    <!-- Metrics Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5 backdrop-blur-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Sales (Bill)</p>
        <p id="total-sales" class="text-2xl font-bold text-amber-400 mt-2">৳0.00</p>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5 backdrop-blur-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Received (Credit)</p>
        <p id="total-credit" class="text-2xl font-bold text-emerald-400 mt-2">৳0.00</p>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5 backdrop-blur-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Adjustment (Debit)</p>
        <p id="total-debit" class="text-2xl font-bold text-indigo-400 mt-2">৳0.00</p>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5 backdrop-blur-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Net Due Balance</p>
        <p id="total-due" class="text-2xl font-bold text-rose-400 mt-2">৳0.00</p>
      </div>
    </div>

    <!-- Action & Entry Section -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
      <!-- Add Transaction Form -->
      <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-6 lg:col-span-1">
        <h2 class="text-lg font-bold mb-4 text-indigo-300 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5"></i> New Transaction Entry
        </h2>
        <form id="transaction-form" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Select Partner</label>
            <select id="form-partner" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" required>
              <option value="Minister hi tech park (DEAL002905)">Minister hi tech park (DEAL002905)</option>
              <option value="BUTTERFLY MARKETING LIMITED (3000002272)">BUTTERFLY MARKETING LIMITED (3000002272)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Transaction Type</label>
            <select id="form-type" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" required>
              <option value="Bill">Bill (+)</option>
              <option value="Credit">Credit (-)</option>
              <option value="Debit">Debit (+)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Amount (BDT)</label>
            <input type="number" step="0.01" id="form-amount" placeholder="0.00" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" required>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Description / Ref</label>
            <input type="text" id="form-desc" placeholder="Invoice or Payment Note" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg text-sm transition-all shadow-lg shadow-indigo-600/20">
            Save Entry
          </button>
        </form>
      </div>

      <!-- Transaction Table View -->
      <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-6 lg:col-span-2 flex flex-col">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
            <i data-lucide="file-text" class="w-5 h-5"></i> Ledger Statement History
          </h2>
          <input type="text" id="search-query" placeholder="Search entries..." class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 w-48">
        </div>

        <div class="overflow-x-auto flex-grow">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="border-b border-slate-800 text-xs text-slate-400 uppercase">
                <th class="py-3 px-4">ID</th>
                <th class="py-3 px-4">Partner</th>
                <th class="py-3 px-4">Type</th>
                <th class="py-3 px-4">Amount</th>
                <th class="py-3 px-4">Due</th>
                <th class="py-3 px-4">Description</th>
                <th class="py-3 px-4">Date</th>
                <th class="py-3 px-4 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="transaction-table-body" class="divide-y divide-slate-800/50">
              <!-- Rendered Dynamically via script.js -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
